# Para onde o dono volta depois de entrar com o Google.
#
# Ficou em `http://localhost:3000` — o padrao do `supabase init` — de 10/07/2026
# ate 04/09/2026, e ninguem reparou porque a entrada por email e senha nao passa
# por aqui. Na primeira vez que o Marcelo entrou com a conta do Google, em
# 04/09, o Supabase descartou o `redirectTo` que o codigo manda
# (`window.location.origin + '/login'`, em AuthContext.tsx) e devolveu-o a
# `localhost:3000`, uma pagina que nao existe no computador dele. Com o token
# da sessao no endereco, a vista de toda a gente.
#
# O `redirectTo` do codigo so e obedecido se o endereco constar da lista
# abaixo. Lista vazia significa: cai sempre no `site_url`.
site_url = "https://binno.pro"
additional_redirect_urls = [
  "https://binno.pro/**",
  "https://www.binno.pro/**",
  "https://*.vercel.app/**",
  "http://localhost:5173/**",
  "http://localhost:4173/**",
  "http://localhost:8080/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true

[auth.external.apple]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[auth.external.github]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

# AS FUNCOES QUE NAO RECEBEM JWT DO SUPABASE.
#
# Tres tipos, e nenhum deles tem um utilizador ligado:
#
#   O que a Meta e o Stripe chamam de fora, assinando com o segredo DELES.
#   O que o Google chama de volta no fim do OAuth.
#   O que o `pg_cron` chama de dentro, provando-se com `x-binno-worker-secret`.
#
# Ate 04/09/2026 so duas estavam aqui, e as outras funcionavam por um ajuste
# feito na plataforma que este ficheiro nao registava. Uma implantacao sem a
# bandeira reactivaria o JWT e elas passariam a devolver 401 — em silencio, com
# o sintoma "os avisos pararam" e nenhuma causa a vista. Foi exactamente o que
# aconteceu com a `oferecer-rascunhos` no primeiro disparo dela.
#
# Nenhuma destas fica aberta: cada uma confere o proprio segredo antes de agir.

[functions.google-business-oauth-callback]
verify_jwt = false

[functions.stripe-billing-webhook]
verify_jwt = false

