name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Bloqueante. `npm run build` (Vite) NÃO verifica tipos — foi este passo
      # que revelou o bug de review gating, em que o FeedbackForm não declarava
      # as props dos links públicos e eles chegavam vazios em produção.
      - name: Verificar tipos
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Verificar i18n do painel
        run: npm run check:i18n-owner

      - name: Build
        run: npm run build

      # Informativo por enquanto: existem 6 erros e 10 avisos herdados do
      # projeto original (Lovable). Quando essa dívida for zerada, remover o
      # continue-on-error para o lint passar a bloquear também.
      - name: Lint (não bloqueante)
        run: npm run lint
        continue-on-error: true
